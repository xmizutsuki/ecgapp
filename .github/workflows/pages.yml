name: Validate and deploy ECG Lab

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "ecg-pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir reportlab cairosvg pypdf

      - name: Prepare bilingual and mobile runtime
        run: |
          python scripts/patch_i18n.py
          python scripts/patch_app_language.py
          python scripts/patch_mobile_zoom.py

      - name: Generate ECG vector library
        run: python scripts/generate_ecg_svgs.py

      - name: Generate bilingual lesson PDFs
        run: python scripts/generate_lesson_pdfs.py

      - name: Validate static bundle
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html app.js styles.css release_features.css i18n.js english_content.js english_content_finalize.js localize_data.js bilingual_ui_fixes.js real_cases.js study_content.js study_casecoach_features.js simulation_features.js supabase/functions/ecg-tutor/index.ts; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done

          test "$(find assets/ecg -type f -name '*.svg' | wc -l)" -eq 114
          test "$(find assets/lessons/pt -type f -name '*.pdf' | wc -l)" -eq 21
          test "$(find assets/lessons/en -type f -name '*.pdf' | wc -l)" -eq 21

          node --check app.js
          node --check i18n.js
          node --check english_content.js
          node --check english_content_finalize.js
          node --check localize_data.js
          node --check bilingual_ui_fixes.js
          node --check real_cases.js
          node --check study_content.js
          node --check study_casecoach_features.js
          node --check simulation_features.js
          python -m py_compile scripts/generate_ecg_svgs.py scripts/generate_lesson_pdfs.py scripts/patch_i18n.py scripts/patch_app_language.py scripts/patch_mobile_zoom.py

          grep -q "english_content.js" index.html
          grep -q "english_content_finalize.js" index.html
          grep -q "bilingual_ui_fixes.js" index.html
          grep -q "touchDistance" app.js
          grep -q "touchAction='none'" app.js
          ! grep -q "const wordMap=" i18n.js

          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          async function validate(lang){
            const sandbox={window:{ECG_LANG:lang},console};
            vm.createContext(sandbox);
            for(const f of ['study_content.js','real_cases.js','english_content.js','english_content_finalize.js','localize_data.js']){
              vm.runInContext(fs.readFileSync(f,'utf8'),sandbox,{filename:f});
            }
            const lib=await sandbox.window.ECG_REAL_LIBRARY.load();
            if(lib.cases.length!==114)throw new Error(`${lang}: expected 114 ECG cases, got ${lib.cases.length}`);
            if(lib.questions.length!==114)throw new Error(`${lang}: expected 114 questions, got ${lib.questions.length}`);
            if(lib.categories.length!==19)throw new Error(`${lang}: expected 19 categories, got ${lib.categories.length}`);
            if(lang==='en'){
              const study=sandbox.window.ECG_STUDY_CONTENT;
              const lessonCount=Object.keys(study.lessons||{}).length;
              const caseCount=Object.values(study.lessons||{}).reduce((n,l)=>n+(l.cases||[]).length,0);
              if(lessonCount!==21)throw new Error(`Expected 21 English lessons, got ${lessonCount}`);
              if(caseCount!==190)throw new Error(`Expected 190 English study cases, got ${caseCount}`);
              const text=JSON.stringify({study,lib});
              const bad=/[ãõáàâéêíóôúç]|\b(ritmo|onda|paciente|pegadinha|traçado|sinusal|fibrilação|taquicardia|bloqueio|tontura|síncope|medicações|avaliação|exame físico|imagem|laboratório|conducao)\b/i.exec(text);
              if(bad)throw new Error(`Portuguese residue detected in curated English content: ${bad[0]}`);
            }
            console.log(`${lang}: library validated with 114 questions.`);
          }
          Promise.all([validate('pt-BR'),validate('en')]).catch(e=>{console.error(e);process.exit(1)});
          NODE

          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from pypdf import PdfReader

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.srcs=[]
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      d=dict(attrs)
                      if d.get('src'): self.srcs.append(d['src'])

          p=Scripts(); p.feed(Path('index.html').read_text(encoding='utf-8'))
          missing=[s for s in p.srcs if not s.startswith(('http://','https://')) and not Path(s).is_file()]
          if missing: raise SystemExit(f'Missing script references: {missing}')

          for lang in ('pt','en'):
              files=sorted((Path('assets/lessons')/lang).glob('*.pdf'))
              bad=[str(f) for f in files if len(PdfReader(str(f)).pages) != 6]
              if bad: raise SystemExit(f'Lesson PDFs must have 6 pages: {bad}')
          print('Static references and 42 six-page PDFs validated.')
          PY

          ! grep -RniE 'registro clínico real|ECG real de paciente|real patient ECG' index.html app.js study_casecoach_features.js README.md DATA_SOURCES.md || {
            echo 'Found wording that may incorrectly imply the synthetic training tracings are real patient ECGs.'
            exit 1
          }

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
