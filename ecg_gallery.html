<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECG Lab — Galeria de Traçados</title><style>
:root{--bg:#07111f;--panel:#0f2035;--line:rgba(255,255,255,.09);--text:#f5f8ff;--muted:#91a7c4;--accent:#4ce0b3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06111e,#0a1b2e);font-family:Inter,system-ui,sans-serif;color:var(--text)}main{max-width:1500px;margin:auto;padding:26px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:20px}.head h1{margin:0 0 6px}.head p{margin:0;color:var(--muted)}select{background:#0a1a2c;color:#fff;border:1px solid var(--line);padding:11px 13px;border-radius:12px}.section{margin:24px 0 36px}.section h2{font-size:19px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;overflow:hidden}.card img{display:block;width:100%;border-radius:12px;background:#fff}.card footer{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;padding:9px 3px 1px}.pill{color:#b9f5e4;background:rgba(76,224,179,.1);border:1px solid rgba(76,224,179,.18);padding:4px 7px;border-radius:999px}@media(max-width:800px){main{padding:15px}.head{display:block}.head select{width:100%;margin-top:14px}.grid{grid-template-columns:1fr}.card{padding:8px}}
</style></head><body><main><div class="head"><div><h1>Galeria de ECGs vetoriais</h1><p>114 traçados • 19 temas • 6 variações por tema. Página para revisão visual da biblioteca.</p></div><select id="filter"><option value="all">Todos os temas</option></select></div><div id="gallery"></div></main><script src="real_cases.js"></script><script>
(async()=>{const lib=await window.ECG_REAL_LIBRARY.load();const filter=document.getElementById('filter'),g=document.getElementById('gallery');lib.categories.forEach(c=>filter.insertAdjacentHTML('beforeend',`<option value="${c.key}">${c.label}</option>`));function draw(){const value=filter.value;const cats=lib.categories.filter(c=>value==='all'||c.key===value);g.innerHTML=cats.map(c=>{const cases=lib.cases.filter(x=>x.category===c.key);return `<section class="section"><h2>${c.label} <span class="pill">${cases.length} variações</span></h2><div class="grid">${cases.map(x=>`<article class="card"><img src="${x.image_url}" loading="lazy" alt="${x.title}"><footer><span>${x.title}</span><span>${x.source_record_id}</span></footer></article>`).join('')}</div></section>`}).join('')}filter.onchange=draw;draw()})();
</script></body></html>
