name: Deploy ECG Lab to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir reportlab cairosvg

      - name: Generate ECG vector library
        run: python scripts/generate_ecg_svgs.py

      - name: Generate bilingual lesson PDFs
        run: python scripts/generate_lesson_pdfs.py

      - name: Validate static bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f i18n.js
          test -f real_cases.js
          test -f real_cases_en.js
          test -f study_content.js
          test -f study_content_en.js
          test -f supabase/functions/ecg-tutor/index.ts
          test "$(find assets/ecg -type f -name '*.svg' | wc -l)" -eq 114
          test "$(find assets/lessons/pt -type f -name '*.pdf' | wc -l)" -eq 21
          test "$(find assets/lessons/en -type f -name '*.pdf' | wc -l)" -eq 21
          grep -q 'real_cases_en.js' index.html
          grep -q 'study_content_en.js' index.html
          grep -q 'case-feedback' app.js
          grep -q 'assets/lessons/' app.js
          grep -q '20 e 80' app.js
          node --check app.js
          node --check i18n.js
          node --check localize_data.js
          node --check real_cases.js
          node --check real_cases_en.js
          node --check study_content.js
          node --check study_content_en.js
          python -m py_compile scripts/generate_ecg_svgs.py scripts/generate_lesson_pdfs.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
