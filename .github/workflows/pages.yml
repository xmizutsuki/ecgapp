name: Deploy ECG Lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate ECG vector assets
        run: python3 scripts/generate_ecg_svgs.py

      - name: Apply safe bilingual translation patch
        run: python3 scripts/patch_i18n.py

      - name: Validate static bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f real_cases.js
          test -f study_content.js
          test -f i18n.js
          test -f styles.css
          test "$(find assets/ecg -type f -name '*.svg' | wc -l)" -eq 114
          grep -q "assets/ecg/sinus_tachy/sinus_tachy_01.svg" real_cases.js
          node --check app.js
          node --check real_cases.js
          node --check study_content.js
          node --check i18n.js
          echo "Static bundle validated: 114 ECG SVGs generated; JavaScript syntax OK."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
