name: Audit study case clinical consistency

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit all 190 study cases
        run: python scripts/audit_study_cases.py
      - name: Export bilingual case data
        run: node scripts/export_study_cases_audit.js
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: study-case-audit-report
          path: study-case-audit-report.json
          if-no-files-found: error
