name: Validate and deploy ECG Lab

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "ecg-pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir reportlab cairosvg pypdf

      - name: Prepare bilingual and interactive runtime
        run: |
          python scripts/patch_i18n.py
          python scripts/patch_app_language.py
          python scripts/patch_mobile_zoom.py
          python scripts/patch_simulation_autofinish.py
          python scripts/patch_training_performance_focus.py
          python scripts/patch_floating_tutor_nav.py

      - name: Generate ECG vector library
        run: python scripts/generate_ecg_svgs.py

      - name: Generate bilingual lesson PDFs
        run: python scripts/generate_lesson_pdfs.py

      - name: Validate Beta 1.1 production bundle
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f config.js
          test -f study_case_ischemia.js
          test -f study_case_ischemia_ui.js
          test -f study_case_zoom.js
          test "$(find assets/ecg -type f -name '*.svg' | wc -l)" -eq 114
          test "$(find assets/lessons/pt -type f -name '*.pdf' | wc -l)" -eq 21
          test "$(find assets/lessons/en -type f -name '*.pdf' | wc -l)" -eq 21

          # Every production JS/CSS reference must exist. Every active JS file must parse.
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess

          class Refs(HTMLParser):
              def __init__(self):
                  super().__init__(); self.scripts=[]; self.styles=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag=='script' and d.get('src'): self.scripts.append(d['src'])
                  if tag=='link' and d.get('rel')=='stylesheet' and d.get('href'): self.styles.append(d['href'])

          p=Refs();p.feed(Path('index.html').read_text(encoding='utf-8'))
          local=[x for x in p.scripts+p.styles if not x.startswith(('http://','https://','//'))]
          missing=[x for x in local if not Path(x).is_file()]
          if missing: raise SystemExit(f'Missing production references: {missing}')
          for script in p.scripts:
              if not script.startswith(('http://','https://','//')):
                  subprocess.run(['node','--check',script],check=True)
          print(f'Validated {len(p.scripts)} production scripts and {len(p.styles)} stylesheets.')
          PY

          python -m py_compile scripts/*.py
          node --check scripts/audit_effective_study_cases.js

          # Release identity and active runtime layers.
          grep -Fq 'APP_VERSION: "1.1.0-beta.1"' config.js
          grep -Fq 'study_case_ischemia.js' index.html
          grep -Fq 'study_case_ischemia_ui.js' index.html
          grep -Fq 'study_case_zoom.js' index.html
          grep -Fq 'beta_runtime.js' index.html
          grep -Fq 'app_shell_v5.css' index.html
          grep -Fq 'app_shell_v5.js' index.html
          grep -Fq 'page_header_cleanup_v1.js' index.html
          ! grep -Fq '<script src="bilingual_ui_fixes.js"' index.html
          ! grep -Fq 'app_shell_v4.css' index.html
          ! grep -Fq 'app_shell_v4.js' index.html

          # Navigation/session stability.
          grep -Fq "version:'7.0.0'" navigation_state_fix.js
          grep -Fq "revision:'7.0.0-mobile-shell-preserve'" navigation_state_fix.js
          grep -Fq "stopImmediatePropagation" navigation_state_fix.js
          grep -Fq "detachRunner('treinar','.cat-runner')" navigation_state_fix.js
          grep -Fq "detachRunner('simulados','.sim-runner-shell')" navigation_state_fix.js
          grep -Fq "ecg:pagechange" navigation_state_fix.js
          grep -Fq "mobileResizeRestore:false" app_shell_v5.js
          grep -Fq "window-scroll-v5" app_shell_v5.js

          # Training, simulations, performance, tutor and beta feedback remain wired.
          grep -Fq 'MIN_COUNT=20,MAX_COUNT=80' training_features.js
          grep -Fq 'training_session_answers' training_features.js
          grep -Fq 'state_snapshot' training_features.js
          grep -Fq 'simulation_answers' simulation_features.js
          grep -Fq 'Histórico de Simulados' simulation_features.js
          grep -Fq 'Practice Exam History' simulation_features.js
          grep -Fq 'learning_events' performance_features.js
          grep -Fq 'user_performance' performance_features.js
          grep -Fq 'performance-insight' performance_features.js
          grep -Fq 'tutor_learning_signals' floating_tutor_v2.js
          grep -Fq 'caseReasoningInput' study_casecoach_features.js
          grep -Fq 'beta_feedback' beta_runtime.js

          # Study-case ECG viewer must preserve the same core interactions as training.
          grep -Fq 'const MAX_ZOOM=8' study_case_zoom.js
          grep -Fq '.case-ecg-image' study_case_zoom.js
          grep -Fq "addEventListener('wheel'" study_case_zoom.js
          grep -Fq "addEventListener('touchmove'" study_case_zoom.js
          grep -Fq 'requestFullscreen' study_case_zoom.js
          grep -Fq '__caseZoomReset' study_case_zoom.js

          # Validate effective clinical study content after all production correction/localization layers.
          node scripts/audit_effective_study_cases.js

          # Validate training ECG/question library in both languages.
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          async function validate(lang){
            const sandbox={window:{ECG_LANG:lang},console};vm.createContext(sandbox);
            for(const f of ['study_content.js','real_cases.js','english_content.js','english_content_finalize.js','localize_data.js']) vm.runInContext(fs.readFileSync(f,'utf8'),sandbox,{filename:f});
            const lib=await sandbox.window.ECG_REAL_LIBRARY.load();
            if(lib.cases.length!==114||lib.questions.length!==114||lib.categories.length!==19) throw new Error(`${lang}: unexpected ECG library size`);
            const cases=new Map(),caseIds=new Set(),questionIds=new Set();
            for(const c of lib.cases){
              if(caseIds.has(String(c.id)))throw new Error(`${lang}: duplicate ECG case ${c.id}`);
              caseIds.add(String(c.id));cases.set(String(c.id),c);
              if(!c.image_url)throw new Error(`${lang}: ECG case ${c.id} has no image`);
            }
            for(const q of lib.questions){
              if(questionIds.has(String(q.id)))throw new Error(`${lang}: duplicate question ${q.id}`);
              questionIds.add(String(q.id));
              const c=cases.get(String(q.ecg_case_id));if(!c)throw new Error(`${lang}: question ${q.id} has no matching ECG case`);
              if(!q.prompt||!q.explanation)throw new Error(`${lang}: incomplete question ${q.id}`);
              const opts=q.options||[];if(opts.length<2)throw new Error(`${lang}: too few alternatives in ${q.id}`);
              const correct=opts.filter(o=>!!(Array.isArray(o)?o[1]:o?.is_correct)).length;
              if(correct!==1)throw new Error(`${lang}: question ${q.id} must have exactly one correct option`);
              const labels=opts.map(o=>String(Array.isArray(o)?o[0]:o?.label||'').trim().toLowerCase());
              if(new Set(labels).size!==labels.length)throw new Error(`${lang}: duplicate alternative in ${q.id}`);
              const difficulty=Number(q.difficulty||c.difficulty||0);if(difficulty<1||difficulty>5)throw new Error(`${lang}: invalid difficulty in ${q.id}`);
            }
            console.log(`${lang}: 114 ECG cases/questions validated.`);
          }
          Promise.all([validate('pt-BR'),validate('en')]).catch(e=>{console.error(e);process.exit(1)});
          NODE

          # Educational files must be parseable and SVGs must not contain active content.
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from pypdf import PdfReader
          for f in Path('assets/ecg').rglob('*.svg'):
              root=ET.parse(f).getroot()
              if root.tag.split('}')[-1] != 'svg': raise SystemExit(f'Invalid SVG root: {f}')
              text=f.read_text(encoding='utf-8',errors='ignore').lower()
              if '<script' in text or 'javascript:' in text or '<foreignobject' in text: raise SystemExit(f'Unsafe SVG content: {f}')
          for lang in ('pt','en'):
              files=sorted((Path('assets/lessons')/lang).glob('*.pdf'))
              bad=[str(f) for f in files if len(PdfReader(str(f)).pages)!=6]
              if bad: raise SystemExit(f'Lesson PDFs must have 6 pages: {bad}')
          print('114 SVGs and 42 lesson PDFs validated.')
          PY

          # Public frontend may contain only the publishable Supabase key, never secrets.
          python - <<'PY'
          from pathlib import Path
          import re
          patterns=[
              re.compile(r'sb_secret_',re.I),
              re.compile(r'service[_ -]?role[_ -]?key',re.I),
              re.compile(r'OPENAI_API_KEY\s*[:=]\s*["\'][^"\']+',re.I),
              re.compile(r'GROQ_API_KEY\s*[:=]\s*["\'][^"\']+',re.I),
              re.compile(r'BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY',re.I),
          ]
          bad=[]
          for ext in ('*.js','*.html','*.css'):
              for path in Path('.').glob(ext):
                  text=path.read_text(encoding='utf-8',errors='ignore')
                  if any(p.search(text) for p in patterns): bad.append(str(path))
          if bad: raise SystemExit(f'Potential frontend secret detected: {bad}')
          print('Frontend secret scan passed.')
          PY

          ! grep -RniE 'registro clínico real|ECG real de paciente|real patient ECG' index.html app.js study_casecoach_features.js study_case_ischemia.js training_features.js performance_features.js floating_tutor_v2.js README.md DATA_SOURCES.md || {
            echo 'Found wording that may incorrectly imply synthetic tracings are real patient ECGs.'; exit 1;
          }

      - name: Stage clean production site
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import shutil

          class Refs(HTMLParser):
              def __init__(self): super().__init__(); self.files=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  value=d.get('src') if tag=='script' else d.get('href') if tag=='link' and d.get('rel')=='stylesheet' else None
                  if value and not value.startswith(('http://','https://','//')): self.files.append(value)

          root=Path('.');out=Path('_site');shutil.rmtree(out,ignore_errors=True);out.mkdir()
          shutil.copy2('index.html',out/'index.html')
          p=Refs();p.feed(Path('index.html').read_text(encoding='utf-8'))
          for rel in dict.fromkeys(p.files):
              src=root/rel;dst=out/rel;dst.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(src,dst)
          shutil.copytree('assets',out/'assets',dirs_exist_ok=True)
          (out/'.nojekyll').write_text('',encoding='utf-8')
          bad=[p for p in out.rglob('*') if p.suffix in {'.py','.pyc','.sql'} or '.github' in p.parts or 'scripts' in p.parts or 'supabase' in p.parts]
          if bad: raise SystemExit(f'Non-runtime files leaked into deploy artifact: {bad[:10]}')
          print(f'Clean site staged with {sum(1 for p in out.rglob("*") if p.is_file())} files.')
          PY

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
