name: Validate premium UI v2

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  premium-ui-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate stable premium interaction layer
        shell: bash
        run: |
          set -euo pipefail
          test -f premium_ui_v2.css
          test -f premium_ui_v2.js
          node --check premium_ui_v2.js

          grep -q 'premium_ui_v2.css' index.html
          grep -q 'premium_ui_v2.js' index.html
          ! grep -q '<script src="premium_motion.js"' index.html
          ! grep -q '<link rel="stylesheet" href="premium_motion.css"' index.html

          # Stable runtime: event-driven only, no DOM observers/prototype patches/navigation gesture capture.
          ! grep -q 'MutationObserver' premium_ui_v2.js
          ! grep -q 'Storage.prototype' premium_ui_v2.js
          ! grep -q 'setInterval' premium_ui_v2.js
          ! grep -q 'touchstart' premium_ui_v2.js
          ! grep -q 'showPage=' premium_ui_v2.js

          # Visible premium treatment + accessibility + ECG fidelity.
          grep -q 'body.ui-v2 .mobile-nav' premium_ui_v2.css
          grep -q 'body.ui-v2 .topbar' premium_ui_v2.css
          grep -q 'body.ui-v2 .card' premium_ui_v2.css
          grep -q 'ui2Sheet' premium_ui_v2.css
          grep -q 'ui2Progress' premium_ui_v2.css
          grep -q 'prefers-reduced-motion:reduce' premium_ui_v2.css
          grep -q 'filter:none!important' premium_ui_v2.css
          grep -q 'navigator.vibrate' premium_ui_v2.js

          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          css=Path('premium_ui_v2.css').read_text(encoding='utf-8')
          js=Path('premium_ui_v2.js').read_text(encoding='utf-8')
          assert html.index('floating_tutor_v2.js') < html.index('premium_ui_v2.css'), 'premium v2 CSS must load after feature runtimes'
          assert html.index('premium_ui_v2.css') < html.index('premium_ui_v2.js'), 'CSS must load before v2 runtime'
          assert len(css) < 40000, 'premium UI v2 CSS unexpectedly large'
          assert len(js) < 12000, 'premium UI v2 JS unexpectedly large'
          zone=css[css.find('/* ---------- ECG safety zone ---------- */'):css.find('/* ---------- mobile:')]
          assert 'filter:none!important' in zone
          assert 'blur(' not in zone and 'drop-shadow' not in zone and 'glow' not in zone.lower(), 'ECG zone must not blur/glow tracings'
          print('Premium UI v2 validated: visible, lightweight, reduced-motion aware and ECG-safe.')
          PY
